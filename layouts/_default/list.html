<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Все посты | Арина Никитенко</title>
    <style>
        body { background: #0d0d0d; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; max-width: 800px; margin: 0 auto; padding: 40px; }
        .card { background: #1a1a1a; border-radius: 16px; padding: 30px; border: 1px solid #333; }
        h1 { color: #ff69b4; }
        .post-item { margin: 20px 0; padding: 15px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; }
        .post-item a { color: #ff69b4; text-decoration: none; font-size: 1.2em; }
        .post-date { color: #888; font-size: 0.85em; }
        .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Все посты</h1>
        {{ range .Pages }}
        <div class="post-item">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            <div class="post-date">{{ .Date.Format "02.01.2006" }}</div>
        </div>
        {{ end }}
        <p><a href="/">← На главную</a></p>
    </div>
    <div class="footer">© 2026 Арина Никитенко</div>
</body>
</html>
